<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Berita - Admin Skillance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'school-blue': '#003366',
                        'school-dark': '#0f172a',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .modal-scroll::-webkit-scrollbar {
            width: 8px;
        }

        .modal-scroll::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .modal-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        .modal-scroll::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>

<body class="bg-gray-100 font-sans text-gray-800">

    <div class="flex h-screen overflow-hidden">
        <aside id="sidebar"
            class="bg-school-blue text-white w-64 flex-shrink-0 fixed md:static inset-y-0 left-0 transform -translate-x-full md:translate-x-0 z-50 sidebar-transition flex flex-col h-full shadow-xl">

        </aside>
        <div id="sidebarOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden md:hidden"
            onclick="toggleSidebar()"></div>

        <div class="flex-1 flex flex-col overflow-hidden">

            <header
                class="h-16 bg-white shadow-sm flex items-center justify-between px-6 border-b border-gray-200 z-10">
                <div class="flex items-center gap-4">
                    <button onclick="toggleSidebar()"
                        class="text-gray-500 focus:outline-none md:hidden mr-4 hover:text-school-blue">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                    <h2 class="text-lg font-bold text-gray-800">Manajemen Berita & Informasi</h2>
                </div>
                <div class="flex items-center gap-3">
                    <span class="text-sm font-semibold hidden sm:block">Administrator</span>
                    <div
                        class="w-8 h-8 bg-gray-300 rounded-full flex items-center justify-center text-gray-600 font-bold text-xs border border-gray-200">
                        AD</div>
                </div>
            </header>

            <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-100 p-6">

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                    <div
                        class="bg-white p-4 rounded shadow-sm border-l-4 border-green-500 flex justify-between items-center">
                        <div>
                            <p class="text-xs text-gray-500 uppercase font-bold">Berita Terbit</p>
                            <h3 class="text-xl font-bold text-gray-800" id="statPublished">0 Artikel</h3>
                        </div>
                        <i class="fas fa-check-circle text-green-100 text-3xl"></i>
                    </div>
                    <div
                        class="bg-white p-4 rounded shadow-sm border-l-4 border-yellow-500 flex justify-between items-center">
                        <div>
                            <p class="text-xs text-gray-500 uppercase font-bold">Draft / Konsep</p>
                            <h3 class="text-xl font-bold text-gray-800" id="statDraft">0 Artikel</h3>
                        </div>
                        <i class="fas fa-edit text-yellow-100 text-3xl"></i>
                    </div>
                    <div
                        class="bg-white p-4 rounded shadow-sm border-l-4 border-blue-500 flex justify-between items-center">
                        <div>
                            <p class="text-xs text-gray-500 uppercase font-bold">Total Pembaca</p>
                            <h3 class="text-xl font-bold text-gray-800">12.5K Views</h3>
                        </div>
                        <i class="fas fa-eye text-blue-100 text-3xl"></i>
                    </div>
                </div>

                <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">

                    <div
                        class="p-4 border-b border-gray-200 flex flex-col md:flex-row justify-between items-center gap-4">
                        <div class="flex gap-2 w-full md:w-auto">
                            <select id="filterCategory" onchange="renderTable()"
                                class="border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-school-blue bg-white">
                                <option value="">Semua Kategori</option>
                                <option value="Kegiatan Sekolah">Kegiatan Sekolah</option>
                                <option value="Prestasi">Prestasi</option>
                                <option value="Pengumuman">Pengumuman</option>
                                <option value="Artikel Guru">Artikel Guru</option>
                            </select>
                            <select id="filterStatus" onchange="renderTable()"
                                class="border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-school-blue bg-white">
                                <option value="">Semua Status</option>
                                <option value="Published">Terbit</option>
                                <option value="Draft">Draft</option>
                            </select>
                        </div>

                        <div class="flex gap-2 w-full md:w-auto">
                            <div class="relative flex-grow">
                                <input type="text" id="searchInput" onkeyup="renderTable()"
                                    placeholder="Cari judul berita..."
                                    class="w-full pl-9 pr-4 py-2 border border-gray-300 rounded text-sm focus:outline-none focus:border-school-blue">
                                <i class="fas fa-search absolute left-3 top-2.5 text-gray-400 text-xs"></i>
                            </div>
                            <button onclick="openModal()"
                                class="bg-school-blue text-white px-4 py-2 rounded text-sm font-bold hover:bg-blue-800 flex items-center gap-2 shadow-sm whitespace-nowrap">
                                <i class="fas fa-plus"></i> Buat Berita
                            </button>
                        </div>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead
                                class="bg-gray-50 text-gray-600 text-xs uppercase font-bold border-b border-gray-200">
                                <tr>
                                    <th class="px-6 py-4 w-16">Cover</th>
                                    <th class="px-6 py-4">Judul & Ringkasan</th>
                                    <th class="px-6 py-4">Kategori</th>
                                    <th class="px-6 py-4">Penulis & Tanggal</th>
                                    <th class="px-6 py-4 text-center">Status</th>
                                    <th class="px-6 py-4 text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="newsTableBody" class="text-sm text-gray-700 divide-y divide-gray-100">
                            </tbody>
                        </table>
                    </div>

                    <div class="px-6 py-4 border-t border-gray-200 flex justify-end">
                        <div class="flex gap-1">
                            <button
                                class="px-3 py-1 border rounded text-xs hover:bg-gray-200 text-gray-600">Prev</button>
                            <button class="px-3 py-1 bg-school-blue text-white rounded text-xs font-bold">1</button>
                            <button
                                class="px-3 py-1 border rounded text-xs hover:bg-gray-200 text-gray-600">Next</button>
                        </div>
                    </div>

                </div>
            </main>
        </div>
    </div>

    <div id="newsModal"
        class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-lg shadow-2xl w-full max-w-5xl h-[90vh] flex flex-col overflow-hidden">

            <div class="bg-white border-b px-6 py-4 flex justify-between items-center">
                <h3 class="font-bold text-lg text-school-blue" id="modalTitle"><i class="fas fa-pen-nib mr-2"></i> Tulis
                    Berita Baru</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-red-500 text-xl"><i
                        class="fas fa-times"></i></button>
            </div>

            <div class="flex-1 overflow-y-auto p-6 bg-gray-50 modal-scroll">
                <form id="newsForm" onsubmit="saveNews(event)">
                    <input type="hidden" id="newsId">
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

                        <div class="lg:col-span-2 space-y-4">
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-1">Judul Berita</label>
                                <input type="text" id="newsTitle" required
                                    class="w-full border border-gray-300 px-4 py-2 rounded focus:outline-none focus:border-school-blue font-bold text-lg"
                                    placeholder="Masukkan judul berita di sini...">
                            </div>

                            <div class="bg-white border border-gray-300 rounded flex flex-col h-[400px]">
                                <div class="bg-gray-100 border-b border-gray-300 px-3 py-2 flex gap-2">
                                    <button type="button" class="p-1 hover:bg-gray-200 rounded text-gray-600"><i
                                            class="fas fa-bold"></i></button>
                                    <button type="button" class="p-1 hover:bg-gray-200 rounded text-gray-600"><i
                                            class="fas fa-italic"></i></button>
                                    <div class="w-px h-6 bg-gray-300 mx-1"></div>
                                    <button type="button" class="p-1 hover:bg-gray-200 rounded text-gray-600"><i
                                            class="fas fa-align-left"></i></button>
                                    <button type="button" class="p-1 hover:bg-gray-200 rounded text-gray-600"><i
                                            class="fas fa-image"></i></button>
                                </div>
                                <textarea id="newsContent" class="flex-1 p-4 focus:outline-none resize-none"
                                    placeholder="Tulis isi berita di sini... (Simulasi Editor)"></textarea>
                            </div>
                        </div>

                        <div class="space-y-6">
                            <div class="bg-white p-4 rounded shadow-sm border border-gray-200">
                                <h4 class="font-bold text-sm text-gray-700 border-b pb-2 mb-3">Status Publikasi</h4>
                                <div class="flex flex-col gap-3">
                                    <label class="flex items-center gap-2 cursor-pointer">
                                        <input type="radio" name="status" value="Published" checked
                                            class="text-school-blue">
                                        <span class="text-sm">Terbitkan Sekarang</span>
                                    </label>
                                    <label class="flex items-center gap-2 cursor-pointer">
                                        <input type="radio" name="status" value="Draft" class="text-school-blue">
                                        <span class="text-sm">Simpan sebagai Draft</span>
                                    </label>
                                </div>
                                <button type="submit"
                                    class="w-full mt-4 bg-school-blue text-white py-2 rounded font-bold hover:bg-blue-800 shadow-lg">
                                    <i class="fas fa-paper-plane mr-1"></i> Simpan
                                </button>
                            </div>

                            <div class="bg-white p-4 rounded shadow-sm border border-gray-200">
                                <h4 class="font-bold text-sm text-gray-700 border-b pb-2 mb-3">Kategori</h4>
                                <select id="newsCategory" class="w-full border px-3 py-2 rounded text-sm bg-white">
                                    <option value="Kegiatan Sekolah">Kegiatan Sekolah</option>
                                    <option value="Prestasi">Prestasi</option>
                                    <option value="Pengumuman">Pengumuman</option>
                                    <option value="Artikel Guru">Artikel Guru</option>
                                </select>
                            </div>

                            <div class="bg-white p-4 rounded shadow-sm border border-gray-200">
                                <h4 class="font-bold text-sm text-gray-700 border-b pb-2 mb-3">Penulis</h4>
                                <input type="text" id="newsAuthor" value="Admin"
                                    class="w-full border px-3 py-2 rounded text-sm bg-white" placeholder="Nama Penulis">
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../assets/js/admin-api.js"></script>
    <script src="../assets/js/admin/data-berita.js"></script>

</body>

</html>
