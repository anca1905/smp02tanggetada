<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data PPDB - Admin Skillance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { 'school-blue': '#003366', 'school-dark': '#0f172a' }, fontFamily: { sans: ['Inter', 'sans-serif'] } }
            }
        }
    </script>
</head>

<body class="bg-gray-100 font-sans text-gray-800">

    <div class="flex h-screen overflow-hidden">
        <aside id="sidebar"
            class="bg-school-blue text-white w-64 flex-shrink-0 fixed md:static inset-y-0 left-0 transform -translate-x-full md:translate-x-0 z-50 sidebar-transition flex flex-col h-full shadow-xl">

        </aside>
        <div id="sidebarOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden md:hidden"
            onclick="toggleSidebar()"></div>

        <div class="flex-1 flex flex-col overflow-hidden">

            <header
                class="h-16 bg-white shadow-sm flex items-center justify-between px-6 border-b border-gray-200 z-10">
                <div class="flex items-center gap-4">
                    <button onclick="toggleSidebar()"
                        class="text-gray-500 focus:outline-none md:hidden mr-4 hover:text-school-blue">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                    <h2 class="text-lg font-bold text-gray-800">Pendaftar Masuk (PPDB)</h2>
                </div>
                <div class="flex items-center gap-3">
                    <span class="text-sm font-semibold hidden sm:block">Administrator</span>
                    <div
                        class="w-8 h-8 bg-gray-300 rounded-full flex items-center justify-center text-gray-600 font-bold text-xs border border-gray-200">
                        AD</div>
                </div>
            </header>

            <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-100 p-6">

                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                    <div class="bg-white p-4 rounded shadow-sm border-l-4 border-blue-500">
                        <p class="text-xs text-gray-500 font-bold uppercase">Total Pendaftar</p>
                        <h3 class="text-xl font-bold" id="statTotal">0 Siswa</h3>
                    </div>
                    <div class="bg-white p-4 rounded shadow-sm border-l-4 border-yellow-500">
                        <p class="text-xs text-gray-500 font-bold uppercase">Menunggu Verifikasi</p>
                        <h3 class="text-xl font-bold text-yellow-600" id="statPending">0 Siswa</h3>
                    </div>
                    <div class="bg-white p-4 rounded shadow-sm border-l-4 border-green-500">
                        <p class="text-xs text-gray-500 font-bold uppercase">Diterima</p>
                        <h3 class="text-xl font-bold text-green-600" id="statAccepted">0 Siswa</h3>
                    </div>
                    <div class="bg-white p-4 rounded shadow-sm border-l-4 border-red-500">
                        <p class="text-xs text-gray-500 font-bold uppercase">Ditolak</p>
                        <h3 class="text-xl font-bold text-red-600" id="statRejected">0 Siswa</h3>
                    </div>
                </div>

                <div
                    class="bg-white p-4 rounded-lg shadow-sm border border-gray-200 mb-6 flex flex-col md:flex-row justify-between gap-4 items-center">
                    <div class="flex gap-2">
                        <button onclick="filterTable('all')"
                            class="bg-white border px-3 py-2 rounded text-sm hover:bg-gray-50 font-bold text-gray-600 focus:ring-2 ring-school-blue">Semua</button>
                        <button onclick="filterTable('Pending')"
                            class="bg-yellow-50 border border-yellow-200 px-3 py-2 rounded text-sm hover:bg-yellow-100 font-bold text-yellow-700 focus:ring-2 ring-yellow-400">Belum
                            Verifikasi</button>
                    </div>
                    <div class="flex gap-2 w-full md:w-auto">
                        <input type="text" id="searchInput" onkeyup="renderTable()" placeholder="Cari No. Reg / Nama..."
                            class="pl-4 pr-4 py-2 border border-gray-300 rounded text-sm w-full md:w-64 focus:outline-none focus:border-school-blue">
                        <button
                            class="bg-school-blue text-white px-4 py-2 rounded text-sm font-bold hover:bg-blue-800"><i
                                class="fas fa-search"></i></button>
                    </div>
                </div>

                <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-gray-50 text-gray-600 text-xs uppercase font-bold border-b border-gray-200">
                            <tr>
                                <th class="px-6 py-4">No. Registrasi</th>
                                <th class="px-6 py-4">Nama Calon Siswa</th>
                                <th class="px-6 py-4">Pilihan Jurusan</th>
                                <th class="px-6 py-4">Asal Sekolah</th>
                                <th class="px-6 py-4">Berkas</th>
                                <th class="px-6 py-4 text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="ppdbTableBody" class="text-sm text-gray-700 divide-y divide-gray-100">
                        </tbody>
                    </table>
                </div>

            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../assets/js/admin-api.js"></script>
    <script src="../assets/js/admin/data-ppdb.js"></script>

</body>

</html>
