<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrator - SMK Negeri 1 Skillance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { 'school-blue': '#003366', 'school-yellow': '#FFCC00' }, fontFamily: { sans: ['Open Sans', 'sans-serif'] } }
            }
        }
    </script>
</head>

<body class="bg-gray-100 h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md border-t-8 border-school-blue">
        <div class="text-center mb-8">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/9c/Logo_Tut_Wuri_Handayani.svg/1200px-Logo_Tut_Wuri_Handayani.svg.png"
                alt="Logo" class="h-16 mx-auto mb-4">
            <h2 class="text-2xl font-bold text-school-blue uppercase">SMK SKILLANCE</h2>
            <p class="text-gray-500 text-sm">Sistem Informasi Manajemen Sekolah</p>
        </div>

        <form action="admin.html" class="space-y-6">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Email / NIP</label>
                <div class="relative">
                    <span class="absolute left-3 top-3 text-gray-400"><i class="fas fa-user"></i></span>
                    <input type="text"
                        class="w-full pl-10 pr-4 py-3 border rounded-lg focus:outline-none focus:border-school-blue focus:ring-1 focus:ring-school-blue"
                        placeholder="admin@sekolah.sch.id">
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Password</label>
                <div class="relative">
                    <span class="absolute left-3 top-3 text-gray-400"><i class="fas fa-lock"></i></span>
                    <input type="password"
                        class="w-full pl-10 pr-4 py-3 border rounded-lg focus:outline-none focus:border-school-blue focus:ring-1 focus:ring-school-blue"
                        placeholder="••••••••">
                </div>
            </div>

            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center text-gray-600">
                    <input type="checkbox" class="mr-2"> Ingat Saya
                </label>
                <a href="#" class="text-school-blue hover:underline">Lupa Password?</a>
            </div>

            <button type="submit"
                class="w-full bg-school-blue text-white font-bold py-3 rounded-lg hover:bg-blue-800 transition shadow-lg">
                MASUK DASHBOARD
            </button>
        </form>

        <div class="mt-8 text-center">
            <a href="index.html" class="text-gray-500 text-sm hover:text-school-blue">
                &larr; Kembali ke Website Utama
            </a>
        </div>
    </div>

</body>

</html>
